workflows:
  android-apk-build:
    name: Build Android APK (Expo)
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      node: 18.20.0
      java: 17
    scripts:
      - name: Cai dat thu vien (Dependencies)
        script: |
          npm install
          
      - name: Chuyen doi Expo sang Android Native (Prebuild)
        script: |
          npm install -g eas-cli
          npx expo prebuild --platform android

      - name: Bien dich file APK bang Gradle
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/**/*.apk
    
    publishing:
      email:
        recipients:
          - email_cua_ban@gmail.com   # <--- THAY EMAIL CỦA BẠN VÀO ĐÂY
        notify:
          success: true
          failure: true
